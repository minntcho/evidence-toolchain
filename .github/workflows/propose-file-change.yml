name: Propose file change

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: Short branch name suffix. The workflow will add a safe prefix and run id.
        required: true
        type: string
      file_path:
        description: Target path under docs/ or tests/.
        required: true
        type: string
      content_b64:
        description: Base64-encoded UTF-8 file content.
        required: true
        type: string
      pr_title:
        description: Draft pull request title and commit message.
        required: true
        type: string
      pr_body:
        description: Draft pull request body.
        required: true
        type: string
      add_label:
        description: Try to add the workflow-generated label if it already exists.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  propose:
    name: Create draft PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch, write file, and open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          FILE_PATH: ${{ inputs.file_path }}
          CONTENT_B64: ${{ inputs.content_b64 }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          ADD_LABEL: ${{ inputs.add_label }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          case "$FILE_PATH" in
            /*|*..*|.github/workflows/*)
              echo "Refusing unsafe file path: $FILE_PATH"
              exit 1
              ;;
            docs/*|tests/*)
              ;;
            *)
              echo "Only docs/ and tests/ are allowed for this workflow."
              exit 1
              ;;
          esac

          BRANCH_SLUG="$(printf '%s' "$BRANCH_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9._/-]+#-#g; s#^-+|-+$##g; s#/{2,}#/#g')"
          BRANCH_SLUG="${BRANCH_SLUG#action/propose-}"

          if [ -z "$BRANCH_SLUG" ]; then
            echo "branch_name must contain at least one safe character."
            exit 1
          fi

          SAFE_BRANCH="action/propose-${BRANCH_SLUG}-${RUN_ID}-${RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$SAFE_BRANCH"

          mkdir -p "$(dirname "$FILE_PATH")"
          printf '%s' "$CONTENT_B64" | base64 -d > "$FILE_PATH"

          git add "$FILE_PATH"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "$PR_TITLE"
          git push --set-upstream origin "$SAFE_BRANCH"

          PR_BODY_WITH_FOOTER="$PR_BODY

---
Generated by workflow_dispatch run ${RUN_ID}.${RUN_ATTEMPT}."

          PR_URL="$(gh pr create \
            --base main \
            --head "$SAFE_BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY_WITH_FOOTER" \
            --draft)"

          echo "Created draft PR: $PR_URL"

          if [ "$ADD_LABEL" = "true" ]; then
            gh pr edit "$PR_URL" --add-label "workflow-generated" || true
          fi
