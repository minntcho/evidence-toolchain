[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-toolchain"
version = "0.1.0"
description = "Independent document-evidence processing engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = [
    "pdfplumber>=0.11",
]

[project.scripts]
evidence-toolchain = "evidence_toolchain.cli:main"
evidence-synthetic = "synthetic.artifact_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["evidence_toolchain*", "evidence_synthetic_runtime*", "synthetic*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
